name: validate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install display libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libmtdev1
      - name: Install locked dependencies
        run: python -m pip install -r pylock.toml && python -m pip install --no-deps -e .
      - name: Validate repository
        run: xvfb-run -a make validate
      - name: Check installed dependencies
        run: python -m pip check
