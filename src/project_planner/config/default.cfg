[database]
path = ~/.project_planner/project_planner.sqlite3
# Optional SQLAlchemy URL. When set, this takes precedence over path.
url =

[window]
width = 1280
height = 800
fullscreen = true

[editor]
autosave_seconds = 20

[ui]
scale = auto

[storage]
data_directory = ~/.project_planner/data
max_image_bytes = 20971520
max_backup_uncompressed_bytes = 8589934592

[api]
# Leave empty to run the embedded localhost API for the desktop client.
url =
cors_origins =
# Optional bearer token. Required when the standalone API binds beyond loopback.
token =
timeout_seconds = 15
backup_timeout_seconds = 120
