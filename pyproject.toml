[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-planner"
version = "0.1.0"
description = "A local-first visual project planning desktop application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Kivy>=2.3,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.12,<1",
    "starlette>=0.46,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
project-planner = "project_planner_frontend.main:main"
project-planner-db = "project_planner.cli.database_transfer:main"
project-planner-api = "project_planner.api.main:main"

[tool.setuptools.packages.find]
where = ["src", "frontend/src"]

[tool.setuptools.package-data]
project_planner = ["config/*.cfg", "shared/database/migrations/script.py.mako"]

[tool.pytest.ini_options]
pythonpath = ["src", "frontend/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
