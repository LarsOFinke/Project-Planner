[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-planner"
version = "0.1.0"
description = "A local-first visual project planning desktop application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Kivy==2.3.1",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "starlette==0.52.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[project.scripts]
project-planner = "project_planner_frontend.main:main"
project-planner-api = "project_planner.api.main:main"

[tool.setuptools.packages.find]
where = ["src", "frontend/src"]

[tool.setuptools.package-data]
project_planner = ["config/*.cfg", "shared/database/migrations/script.py.mako"]

[tool.pytest.ini_options]
pythonpath = ["src", "frontend/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
